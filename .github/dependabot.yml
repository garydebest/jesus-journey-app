version: 2
# One grouped pull request per ecosystem per month to keep notification email
# low. Security updates still open as soon as an advisory is published.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-updates:
        patterns: ["*"]
    # Major versions (e.g. Tailwind 4, Vite 8) need code changes; review them
    # by hand in the quarterly review. Security updates are not affected.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /server/report-engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-updates:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-updates:
        patterns: ["*"]
