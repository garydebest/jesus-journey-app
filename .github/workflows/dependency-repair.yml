name: Tested dependency repair
on:
  push:
    branches: [security/readiness-2026-10-10]
    paths: [.github/workflows/dependency-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  repair:
    if: github.ref == 'refs/heads/security/readiness-2026-10-10'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jj
          POSTGRES_PASSWORD: jj
          POSTGRES_DB: jj_preview
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U jj -d jj_preview" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://jj:jj@localhost:5432/jj_preview?sslmode=disable
      MAILER_TEST_OUTBOX: '1'
      ADMIN_KEY: qa-admin-key
      ADMIN_USERNAME: admin
      NODE_ENV: test
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/readiness-2026-10-10
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair lockfile without forced upgrades
        run: |
          cp package-lock.json /tmp/before-lock.json
          status=0
          npm audit fix --package-lock-only --ignore-scripts > repair.log 2>&1 || status=$?
          cat repair.log
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          git diff --exit-code -- package.json
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync("/tmp/before-lock.json")),b=JSON.parse(fs.readFileSync("package-lock.json")); const rows=Object.entries(b.packages).filter(([p,v])=>p && a.packages[p]?.version!==v.version).map(([p,v])=>p+": "+(a.packages[p]?.version??"new")+" -> "+v.version); fs.writeFileSync("changes.log",rows.join("\n"));'
      - name: Install and check updated dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r server/report-engine/requirements.txt
          npm run check
          npm run build
      - name: Initialize isolated schema and fixtures
        run: |
          node -e 'const u=new URL(process.env.DATABASE_URL); if(process.env.CI!=="true" || !["localhost","127.0.0.1"].includes(u.hostname) || u.pathname!=="/jj_preview") throw new Error("Refusing non-local test database");'
          npm run db:push -- --force
          npx --no-install tsx -e 'import {ensureBootstrapped} from "./server/storage"; ensureBootstrapped().then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1);});'
          npx --no-install tsx script/seed-preview.ts
      - name: Test password and report safety before saving lockfile
        run: |
          npx --no-install tsx script/password-reset-qa.ts
          JJ_QA_VARIANT=full npx --no-install tsx script/close-safety-qa.ts
          JJ_QA_VARIANT=short npx --no-install tsx script/close-safety-qa.ts
          JJ_QA_VARIANT=mixed npx --no-install tsx script/close-safety-qa.ts
      - name: Save tested lockfile only to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update lockfile with non-forced security fixes after isolated tests"
            git push origin HEAD:security/readiness-2026-10-10
          fi
          git rev-parse HEAD > tested-commit.log
      - name: Capture remaining audit findings
        if: always()
        run: npm audit --omit=dev --audit-level=high > remaining-audit.log 2>&1 || true
      - name: Report outcome to draft PR 24
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: '${{ job.status }}'
        with:
          script: |
            const fs=require('fs');
            const read=p=>fs.existsSync(p)?fs.readFileSync(p,'utf8'):'Not available';
            const detail=('Changed versions:\n'+read('changes.log')+'\nRemaining audit:\n'+read('remaining-audit.log')).slice(-22000).replace(/`/g,"'");
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:24,body:'Dependency repair result: '+process.env.RESULT+'\nRecorded branch commit: '+read('tested-commit.log').trim()+'\nLockfile saved only if build and isolated tests passed. No production deployment. Automated-token pushes do not automatically trigger other workflows; these tests ran in this repair job.\n\n```text\n'+detail+'\n```'});
