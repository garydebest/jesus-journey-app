name: JavaScript external dependency review
on:
  push:
    branches: [security/readiness-2026-10-10]
    paths: [.github/workflows/javascript-transitive-review.yml]
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify inspection evidence still matches application source
        run: git diff --exit-code f4b1bd2c53e540143c806b874f7695d5f8b7bea7 HEAD -- server shared client script package.json package-lock.json vite.config.ts postcss.config.js tailwind.config.ts
      - uses: actions/download-artifact@v4
        with:
          name: javascript-dependency-evidence
          run-id: 38071347340
          github-token: '${{ github.token }}'
          path: inspection-evidence
      - run: npm ci --ignore-scripts
      - name: Trace installed dependency paths conservatively
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {builtinModules} from 'node:module';
          const evidence=JSON.parse(fs.readFileSync('inspection-evidence/reachability-report.json'));
          if(evidence.commit!=='f4b1bd2c53e540143c806b874f7695d5f8b7bea7')throw new Error('Unexpected evidence revision');
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),packages=lock.packages;
          const flagged=new Set(Object.keys(JSON.parse(fs.readFileSync('inspection-evidence/javascript-audit.json')).vulnerabilities||{}));
          const builtins=new Set(builtinModules.map(n=>n.replace(/^node:/,'')));
          const rootNames=[...new Set(evidence.externalImports.filter(n=>!builtins.has(n.replace(/^node:/,''))).map(n=>n.startsWith('@')?n.split('/').slice(0,2).join('/'):n.split('/')[0]))];
          function resolve(from,name){let dir=from;while(true){const p=path.posix.join(dir,'node_modules',name);if(packages[p]&&fs.existsSync(p+'/package.json'))return p;if(!dir||dir==='.')break;dir=path.posix.dirname(dir);if(dir==='.')dir='';}return null;}
          const queue=[],missing=[],seen=new Set(),matches=[];
          for(const name of rootNames){const p=resolve('',name);if(p)queue.push({p,chain:[p]});else missing.push({from:'compiled server',name,kind:'external'});}
          while(queue.length){const {p,chain}=queue.shift();if(seen.has(p))continue;seen.add(p);const manifest=JSON.parse(fs.readFileSync(p+'/package.json'));if(packages[p].version!==manifest.version)throw new Error('Installed/lock version mismatch: '+p);if(flagged.has(manifest.name))matches.push({name:manifest.name,version:manifest.version,chain});for(const kind of ['dependencies','optionalDependencies','peerDependencies']){for(const name of Object.keys(manifest[kind]||{})){const target=resolve(p,name);if(target)queue.push({p:target,chain:[...chain,target]});else missing.push({from:p,name,kind,optional:kind==='optionalDependencies'||!!manifest.peerDependenciesMeta?.[name]?.optional});}}}
          const report={commit:process.env.GITHUB_SHA,evidenceCommit:evidence.commit,externalRoots:rootNames,visitedPackages:[...seen].sort(),flaggedDependencyPaths:matches,unresolvedDependencies:missing,limitations:'Conservative installed manifest graph, not execution tracing. Includes optional and peer edges when installed. Missing dependencies require review; absence of matches is not automatic sign-off. Dynamic undeclared imports, child processes, frontend/build-time risks and live deployment remain outside this check.'};
          fs.writeFileSync('transitive-review.json',JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-transitive-review
          path: transitive-review.json
      - name: Publish review evidence to PR 24
        uses: actions/github-script@v9
        with:
          script: |
            const fs=require('fs');const report=fs.readFileSync('transitive-review.json','utf8');
            if(report.length>22000)throw new Error('Report too large; inspect artifact');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:24,body:'External dependency review on '+context.sha+'\nNo application, styling or production changes.\n```json\n'+report.replace(/`/g,"'")+'\n```'});
